name: 刷新租房数据

on:
  schedule:
    # GitHub 的 cron 一律用 UTC。北京时间 = UTC+8，所以要减 8 小时：
    #   北京时间 09:00 / 16:00 / 23:00  →  UTC 01:00 / 08:00 / 15:00
    - cron: '0 1,8,15 * * *'
  workflow_dispatch:          # 允许手动触发：仓库页 Actions → 本工作流 → Run workflow
  push:
    # 改了脚本或工作流本身时自动跑一次，方便验证改动是否正常。
    # 只监听这几个文件 —— 机器人自己提交的 data/ 与 index.html 不在其中，不会造成循环触发。
    paths:
      - 'scrape.py'
      - 'build.py'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write             # 需要写权限才能把更新提交回仓库

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取出仓库
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # scrape.py 只用标准库（urllib），不需要 pip install
      - name: 巡检 28Hse 在架状态与最新租金
        env:
          RUN_SUMMARY: ${{ runner.temp }}/summary.md
        run: python scrape.py

      # scrape.py 只在有实质变化（下架 / 改价）时才写文件，
      # 所以这里看 data/ 有没有 diff，就知道该不该重建和提交。
      - name: 有变化才重新生成页面并提交
        run: |
          if git diff --quiet -- data/; then
            echo "本次巡检没有实质变化，跳过重建与提交"
            exit 0
          fi
          python build.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: 自动巡检 $(date -u +%Y-%m-%d)"
          git push
          echo "已提交更新"

      - name: 汇总
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/summary.md" ]; then
            cat "${{ runner.temp }}/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "巡检脚本未产出摘要，请查看上面的步骤日志。" >> $GITHUB_STEP_SUMMARY
          fi
